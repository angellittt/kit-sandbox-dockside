services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    restart: always
    ports:
      - 5173:5173
    networks:
      - ttt_network
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    restart: always
    ports:
      - 8000:8000
    networks:
      - ttt_network
networks:
  ttt_network:
    external: true
