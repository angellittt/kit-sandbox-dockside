services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: production
    restart: always
    ports:
      - 80:80
      - 443:443
    networks:
      - ttt_network
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: production
    restart: always
    ports:
      - 8080:8000
    networks:
      - ttt_network
networks:
  ttt_network:
